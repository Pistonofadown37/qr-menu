<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>İBO CHEF | Dijital Menü</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">

    <img
        src="images/ibo-chef-logo.png"
        class="logo-image"
        alt="İBO CHEF Logo"
    >

    <div class="logo">İBO CHEF</div>

    <div class="subtitle">Dijital Menü</div>

</header>
    </header>
<div class="calorie-button-wrapper">
    <button class="calorie-button" onclick="openCalorieCalculator()">
        Kalori Hesaplayıcı
    </button>
</div>
    <nav id="categories" class="categories"></nav>
    <section id="products" class="products"></section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Kapat">×</button>
      <img id="modalImage" class="modal-image" alt="">
      <div class="modal-body">
        <div id="modalCategory" class="modal-category"></div>
        <h2 id="modalName"></h2>
        <div id="modalPrice" class="modal-price"></div>
        <p id="modalDescription"></p>
        <p id="modalIngredients"></p>       
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
  <script src="script.js"></script>
  <script>
    /* Çorba bilgileri: mevcut menu.js yapısını değiştirmeden düzelt */
    if (typeof menuData !== "undefined" && Array.isArray(menuData.products)) {
      const gununCorbasi = menuData.products.find(product => product.id === 66);
      const balikCorbasi = menuData.products.find(product => product.id === 67);

      if (gununCorbasi) {
        gununCorbasi.description = "Günün çorbası, günlük olarak değişen çeşidiyle sıcak ve taze servis edilir.";
        gununCorbasi.ingredients = "Günün çorbasına göre değişmektedir.";
        gununCorbasi.allergens = "Çorba çeşidine göre değişebilir; yetkiliye sorunuz.";
        gununCorbasi.calories = 150;
      }

      if (balikCorbasi) {
        balikCorbasi.description = "Taze balık ve sebzelerle hazırlanan, sıcak ve lezzetli balık çorbası.";
        balikCorbasi.ingredients = "Balık, sebzeler, limon, tuz, karabiber, baharat";
        balikCorbasi.allergens = "Balık; diğer alerjenler tarife göre değişebilir.";
        balikCorbasi.calories = 140;
      }

      /* Sayfa açılışında Çorbalar zaten seçiliyse kartları yenile. */
      if (typeof activeCategory !== "undefined" && activeCategory === "corba" && typeof renderProducts === "function") {
        renderProducts();
      }
    }
  </script>
</body>
</html>
